plugins { id 'com.android.application' }

android {
    namespace 'com.example.voicemail'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.voicemail"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // URL of the backend that serves the React app.
        // Default works with:  adb reverse tcp:3000 tcp:3000
        // For a hosted backend (e.g. Render) put its https URL here.
        buildConfigField "String", "APP_URL", "\"${project.findProperty('APP_URL') ?: 'http://localhost:3000'}\""
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
