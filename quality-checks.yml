name: Quality Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
      - name: Run frontend build when available
        shell: bash
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)" \
            && npm run build \
            || { code=$?; if [ "$code" -eq 1 ]; then echo 'No build script found; skipping build.'; else exit "$code"; fi; }
      - name: Run frontend tests when available
        shell: bash
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)" \
            && npm test -- --run \
            || { code=$?; if [ "$code" -eq 1 ]; then echo 'No test script found; skipping tests.'; else exit "$code"; fi; }

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check backend exists
        id: backend
        shell: bash
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install backend dependencies
        if: steps.backend.outputs.exists == 'true'
        run: npm install
      - name: Run backend tests when available
        if: steps.backend.outputs.exists == 'true'
        shell: bash
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)" \
            && npm test \
            || { code=$?; if [ "$code" -eq 1 ]; then echo 'No backend test script found; skipping tests.'; else exit "$code"; fi; }
